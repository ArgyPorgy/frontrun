# Optional local infra. Native Postgres and Redis work just as well.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: frontrun
      POSTGRES_PASSWORD: frontrun
      POSTGRES_DB: frontrun_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
